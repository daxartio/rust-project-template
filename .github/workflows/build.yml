name: Build Template
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**/docs/**"
      - "**.md"

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      PROJECT_NAME: mytemplate
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo generate
        run: |
          wget 'https://github.com/cargo-generate/cargo-generate/releases/download/v0.23.3/cargo-generate-v0.23.3-x86_64-unknown-linux-gnu.tar.gz' --output-document 'cargo-generate.tar.gz'
          tar -zxvf cargo-generate.tar.gz

      - name: Generate
        run: |
          ./cargo-generate generate . --name ${{ env.PROJECT_NAME }} \
            -d gh-username="daxartio" \
            -d project-description="Example of Rust GitHub template" \
            -d license="MIT" \
            -d docs=true

      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cargo check
        run: |
          mv $PROJECT_NAME ${{ runner.temp }}/
          cd ${{ runner.temp }}/$PROJECT_NAME
          cargo check
          cargo +nightly fmt --all -- --check
          cargo clippy --all-targets --all-features --workspace

      - name: Install mdBook
        run: |
          wget 'https://github.com/rust-lang/mdBook/releases/download/v0.4.51/mdbook-v0.4.51-x86_64-unknown-linux-gnu.tar.gz' --output-document 'mdbook.tar.gz'
          tar -zxvf mdbook.tar.gz

      - name: Build Book
        run: ./mdbook build
